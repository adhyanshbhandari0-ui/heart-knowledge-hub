name: california-ihss-county-wages-2026
description: >-
  The 2026 hourly wage each of California's 58 counties pays an IHSS Individual
  Provider (in-home caregiver) under the Medi-Cal In-Home Supportive Services
  program, from the California Department of Social Services. Government program
  wages, not private-pay prices. CC BY 4.0. Reproducible from a standard-library
  fetch script.
